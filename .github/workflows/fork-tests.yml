name: fork tests

# 本仓 fork 定型线的全量回归：推送即跑，不依赖本地/服务器资源。
# 上游只在 tag 发布（release.yml）与少数 PR 路径（javascript-runtime.yml）
# 才跑全量 pytest，这里复用同一套依赖安装配方，把触发条件挂到定型线上。
#
# 可观测性约定：匿名访问者能看到 annotation、看不到 job log，因此
#   1) 依赖安装/测试步骤都把输出 tee 到 *.log，失败时按修改时间倒序取最新两份；
#   2) 「Publish failure output」用 if: failure() || cancelled()，被取消也留下最后 10 行，
#      成功时不发任何 annotation（否则绿榜上会挂一堆假 error）。
#   3) PR 描述里的结果由 pr-summary job 用 GITHUB_TOKEN 写入 ——
#      开发这一支的工作站只有 SSH 推送权限、没有任何 GitHub API 凭据，写不了 PR 描述。
#      逻辑放在 .github/scripts/fork-ci-summary.cjs（可用 node 直接单测）。
#      PR 本身要人工在网页上点一次：仓库没开「Allow GitHub Actions to create and approve
#      pull requests」，CI 建 PR 会被拒（实测 GitHub Actions is not permitted to create or
#      approve pull requests）。
# runner 钉 ubuntu-24.04：ubuntu-latest 从 2026-10-19 起迁 Ubuntu 26，
# apt 包名（libgdk-pixbuf-2.0-0 等）在新镜像上未验证，钉死才有可比性。
on:
  push:
    # 定型线每次 rebase 都会换成 analysis-YYYYMMDD-HHMM，用通配才不用每次改这里
    branches:
      - 'analysis-*'
  pull_request:
    branches:
      - 'analysis-*'
      - main
  workflow_dispatch:

concurrency:
  group: fork-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: backend pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      pytest: ${{ steps.collect.outputs.pytest }}
      marketdata: ${{ steps.collect.outputs.marketdata }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
      - name: Install PDF system dependencies
        timeout-minutes: 10
        run: |
          set -o pipefail
          . /etc/os-release
          echo "runner: $PRETTY_NAME / $(python -V 2>&1)"
          sudo apt-get update -qq 2>&1 | tee -a install-apt.log
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libcairo2 libcairo-gobject2 libgdk-pixbuf-2.0-0 \
            libffi-dev libfontconfig1 fonts-noto-cjk 2>&1 | tee -a install-apt.log
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          set -o pipefail
          echo "step install-pip"
          python -m pip install -r requirements.txt 2>&1 | tee install-pip.log
      - name: Run backend tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          echo "step pytest"
          python -m pytest tests/ -q 2>&1 | tee pytest.log
      - name: Run marketdata package tests
        timeout-minutes: 10
        run: |
          set -o pipefail
          echo "step pytest-marketdata"
          python -m pytest packages/marketdata/tests -q 2>&1 | tee pytest-marketdata.log
      - name: Collect result lines
        id: collect
        if: always()
        run: |
          last_result () {
            if [ -f "$1" ]; then grep -E '[0-9]+ (passed|failed|error)' "$1" | tail -n 1; else echo '(no output)'; fi
          }
          {
            echo "pytest=$(last_result pytest.log)"
            echo "marketdata=$(last_result pytest-marketdata.log)"
          } >> "$GITHUB_OUTPUT"
      - name: Publish failure output
        if: failure() || cancelled()
        run: |
          echo "::error::logs captured: $(ls *.log 2>/dev/null | tr '\n' ' ')"
          for f in $(ls -t *.log 2>/dev/null | head -2); do
            echo "::group::$f (tail)"
            tail -n 40 "$f" || true
            echo "::endgroup::"
            grep -E '^(FAILED|ERROR)' "$f" | head -8 || true
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error file=$f::$line"
            done < <(tail -n 10 "$f")
          done

  frontend:
    name: frontend vitest + build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      vitest: ${{ steps.collect.outputs.vitest }}
      build: ${{ steps.collect.outputs.build }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee install-pnpm.log
      # pnpm 9 会把未知的 --run 当自己的参数（Unknown option: 'run'），
      # 传参给 vitest 必须走 pnpm exec。
      - name: Run unit tests
        run: |
          set -o pipefail
          pnpm exec vitest run 2>&1 | tee vitest.log
      - name: Check UI primitives
        run: |
          set -o pipefail
          pnpm check:ui 2>&1 | tee check-ui.log
      - name: Check market colours
        run: |
          set -o pipefail
          pnpm check:market-colors 2>&1 | tee check-colors.log
      - name: Typecheck and build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      - name: Collect result lines
        id: collect
        if: always()
        run: |
          test_summary () {
            if [ -f "$1" ]; then grep -E 'Tests +[0-9]+|Test Files +[0-9]+' "$1" | tr -s ' ' | tr '\n' ' '; else echo '(no output)'; fi
          }
          {
            echo "vitest=$(test_summary vitest.log)"
            echo "build=$([ -f build.log ] && tail -n 1 build.log | cut -c1-200 || echo '(no output)')"
          } >> "$GITHUB_OUTPUT"
      - name: Publish failure output
        if: failure() || cancelled()
        run: |
          echo "::error::logs captured: $(ls *.log 2>/dev/null | tr '\n' ' ')"
          for f in $(ls -t *.log 2>/dev/null | head -2); do
            echo "::group::$f (tail)"
            tail -n 40 "$f" || true
            echo "::endgroup::"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error file=$f::$line"
            done < <(tail -n 10 "$f")
          done

  # PR 同步时把两个 job 的实测结果写进 PR 描述（区块用 HTML 注释标记，替换不追加）。
  pr-summary:
    name: pr description
    needs: [backend, frontend]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Write CI evidence into the pull request body
        uses: actions/github-script@v7
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_PYTEST: ${{ needs.backend.outputs.pytest }}
          BACKEND_MARKETDATA: ${{ needs.backend.outputs.marketdata }}
          FRONTEND_VITEST: ${{ needs.frontend.outputs.vitest }}
          FRONTEND_BUILD: ${{ needs.frontend.outputs.build }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            const { upsertSummaryForNumber } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/fork-ci-summary.cjs`)
            await upsertSummaryForNumber(github, core, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: context.payload.pull_request.number,
              env: process.env,
            })
