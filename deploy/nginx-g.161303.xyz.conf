# ============================================================
#  g.161303.xyz —— PanWatch（fork 版，源码部署）
#
#  上游：本机 127.0.0.1:8000（systemd 单元 panwatch.service）
#        源码 /opt/PanWatch/app，数据 /opt/PanWatch/data，
#        前端产物 /opt/PanWatch/app/static
#  证书：/opt/certs/live/main/（*.161303.xyz 泛域名，acme.sh 自动续期）
#
#  认证：两层 —— nginx basic auth（用户 ryb，口令文件 /etc/nginx/.htpasswd）
#    + 应用自带的登录（数据库里的 auth_username / auth_password_hash，账号 admin）。
#
#    为什么 /api/ 与 /mcp 必须 auth_basic off：
#      前端登录后对每个 API 请求都带 `Authorization: Bearer <token>`，会和
#      basic auth 抢**同一个** Authorization 头 —— 结果 nginx 认为凭据不对，
#      浏览器反复弹认证框（这是 gp1 当初踩过的坑）。所以这两个前缀只留应用登录。
#      代价说清楚：/api/ 上不再有 basic auth 这一层，唯一门就是应用自己的登录。
#
#  端口暴露：应用绑 127.0.0.1:8000（不用上游默认的 0.0.0.0），
#    即使有人扫到 8000 也进不来，唯一入口是本文件。
#
#  注意：本文件不重复定义 map $http_upgrade $connection_upgrade ——
#    docker.161303.xyz 里已经定义过一次，nginx 全机只能有一份。
#
#  改完执行：sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ---------- 80：放行 ACME 校验，其余跳 HTTPS ----------
server {
    listen      80;
    listen [::]:80;
    server_name g.161303.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/acme;
        default_type "text/plain";
        allow        all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：正式站点 ----------
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2       on;
    server_name g.161303.xyz;

    ssl_certificate     /opt/certs/live/main/fullchain.pem;
    ssl_certificate_key /opt/certs/live/main/privkey.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 唯一一层认证：nginx basic auth ----
    auth_basic           "restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 64m;

    # 出口只有 3Mbps，主干 bundle 600KB+，必须压
    gzip            on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary      on;
    gzip_proxied   any;
    gzip_types      text/plain text/css text/javascript application/json
                    application/javascript application/x-javascript
                    text/xml application/xml image/svg+xml
                    application/manifest+json;

    # ---- 反代参数（server 级，location 继承）----
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 5s;

    # ---- PWA manifest 免认证（必须）----
    #  浏览器取 manifest 走的是 CORS 语义、**不带凭据**（除非 <link rel="manifest">
    #  上写了 crossorigin="use-credentials"，上游 index.html 没有），所以它必然
    #  撞 basic auth 拿 401，控制台刷「Manifest fetch from ... failed, code 401」，
    #  且这道 401 不会像普通子资源那样被认证挑战救回来。
    #  manifest 只是一份静态元信息（名称/图标/主题色），放行不泄露业务数据；
    #  为不对外暴露金融字样，frontend/public/manifest*.json 的描述已改成中性文案。
    #  实测：无凭据 GET /manifest.json 由 401 → 200；其余路径仍 401。
    location = /manifest.json {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /manifest.zh-CN.json {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
    }

    # AI 分析类接口可能跑很久；SSE 需要关缓冲，否则事件被攒着不下发。
    # auth_basic off：应用登录后的 Bearer 会和 basic auth 抢 Authorization 头（见文件头）。
    location /api/ {
        auth_basic        off;
        proxy_pass        http://127.0.0.1:8000;
        proxy_buffering   off;
        proxy_cache       off;
        proxy_read_timeout 3600s;
    }

    # MCP（Streamable HTTP）同样只认 Bearer。
    location /mcp {
        auth_basic        off;
        proxy_pass        http://127.0.0.1:8000;
        proxy_buffering   off;
        proxy_cache       off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
